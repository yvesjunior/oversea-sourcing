# Production stack — built, immutable web image + Postgres.
# Usage: ./scripts/deploy.sh (VM) or ./scripts/prod.sh (local test)
#
# Secrets come from .env (gitignored; template in .env.example): POSTGRES_PASSWORD, DATABASE_URL,
# BETTER_AUTH_SECRET (+ GOOGLE_CLIENT_ID/SECRET once a domain+TLS exist).

services:
  web:
    build:
      context: .
      dockerfile: infra/Docker/web.Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # The VM has no IPv6 route, but DNS returns AAAA for Google, Anthropic and
      # most large hosts. Node's happy-eyeballs then races both families and the
      # v6 attempt can hang until the socket times out instead of failing fast —
      # which surfaced as Google sign-in "failing silently" (the server-to-server
      # token exchange timing out with ETIMEDOUT inside better-auth). Preferring
      # A records removes the dead path. Drop this if the VM ever gets real IPv6.
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - PORT=3000
    ports:
      # Host 3010 → container 3000. Override with WEB_PORT=<port> if needed.
      - "${WEB_PORT:-3010}:3000"
    volumes:
      - osi-uploads:/data/uploads
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Background jobs (pg-boss): AI criteria extraction + pipeline orchestrator.
  # Uses the build stage (full source + dev deps → tsx available), like migrate.
  worker:
    build:
      context: .
      dockerfile: infra/Docker/web.Dockerfile
      target: build
    command: npx tsx src/worker.ts
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # The VM has no IPv6 route, but DNS returns AAAA for Google, Anthropic and
      # most large hosts. Node's happy-eyeballs then races both families and the
      # v6 attempt can hang until the socket times out instead of failing fast —
      # which surfaced as Google sign-in "failing silently" (the server-to-server
      # token exchange timing out with ETIMEDOUT inside better-auth). Preferring
      # A records removes the dead path. Drop this if the VM ever gets real IPv6.
      - NODE_OPTIONS=--dns-result-order=ipv4first
      # Which queues this worker consumes (default: both). To scale research
      # out, set WORKER_QUEUES=pipeline in .env and enable the worker-research
      # service below: docker compose --profile scale up -d
      - WORKER_QUEUES=${WORKER_QUEUES:-pipeline,research}
    volumes:
      # The worker reads buyer attachments during research (E4) — without this
      # mount every file lookup is an ENOENT, since only `web` writes uploads.
      - osi-uploads:/data/uploads
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Dedicated research worker — the scaling knob for platform hotspot #1
  # (validated 2026-08-22). OFF by default (profile `scale`); when enabling it,
  # set WORKER_QUEUES=pipeline in .env so the main worker stops competing:
  #   WORKER_QUEUES=pipeline docker compose -f docker-compose.prod.yml --profile scale up -d
  worker-research:
    profiles: ["scale"]
    build:
      context: .
      dockerfile: infra/Docker/web.Dockerfile
      target: build
    command: npx tsx src/worker.ts
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - WORKER_QUEUES=research
    volumes:
      - osi-uploads:/data/uploads
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # One-shot: applies Drizzle migrations on every deploy, then exits.
  # Uses the build stage (full source + dev deps → drizzle-kit available).
  migrate:
    build:
      context: .
      dockerfile: infra/Docker/web.Dockerfile
      target: build
    command: npm run db:migrate
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy

  database:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-osi}
      - POSTGRES_DB=${POSTGRES_DB:-osi}
      # POSTGRES_PASSWORD must come from .env — no default on purpose.
    # No host port: the database is reachable only on the compose network.
    volumes:
      - osi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osi} -d ${POSTGRES_DB:-osi}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  osi-db-data:
  osi-uploads:
