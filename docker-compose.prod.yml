# Production stack — built, immutable web image.
# Usage: docker compose -f docker-compose.prod.yml up --build

services:
  web:
    build:
      context: .
      dockerfile: infra/Docker/web.Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "${WEB_PORT:-3000}:3000"
