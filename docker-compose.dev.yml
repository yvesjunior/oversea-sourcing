# Development stack — hot-reloading web app with source mounted from the host.
# Usage: docker compose -f docker-compose.dev.yml up

services:
  web:
    build:
      context: .
      dockerfile: infra/Docker/web.Dockerfile
      target: deps # dev runs the Vite dev server from the installed deps
    command: npm run dev
    working_dir: /app
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    ports:
      # Vite dev server binds 8080 (Lovable sandbox config), not 3000.
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./:/app
      - /app/node_modules # keep the image's node_modules, don't shadow with host
