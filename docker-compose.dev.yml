# Development stack — hot-reloading web app with source mounted from the host.
# Usage: ./scripts/dev.sh   (→ http://localhost:3010)

services:
  web:
    build:
      context: .
      dockerfile: infra/Docker/web.Dockerfile
      target: deps # dev runs the Vite dev server from the installed deps
    command: npm run dev
    working_dir: /app
    env_file:
      - .env
      # Secrets (ANTHROPIC_API_KEY…) — compose only interpolates ${...} from
      # .env, so .env.local must be loaded explicitly to reach the container.
      - path: .env.local
        required: false
    environment:
      - NODE_ENV=development
      # Dev-only credentials (non-secret by design; prod uses .env.local)
      - DATABASE_URL=postgres://osi:osi@database:5432/osi
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-osi-dev-insecure-secret}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3010}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    ports:
      # Same host port as prod (3010). Vite binds 8080 inside the container
      # (Lovable sandbox config) — only the host mapping changes.
      - "${WEB_PORT:-3010}:8080"
    volumes:
      - ./:/app
      - /app/node_modules # keep the image's node_modules, don't shadow with host
      - osi-dev-uploads:/data/uploads
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Background jobs (pg-boss): AI criteria extraction + pipeline orchestrator.
  worker:
    build:
      context: .
      dockerfile: infra/Docker/web.Dockerfile
      target: deps
    command: npx tsx watch src/worker.ts
    working_dir: /app
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://osi:osi@database:5432/osi
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # One-shot: applies Drizzle migrations on every `up`, then exits.
  migrate:
    build:
      context: .
      dockerfile: infra/Docker/web.Dockerfile
      target: deps
    command: npm run db:migrate
    working_dir: /app
    environment:
      - DATABASE_URL=postgres://osi:osi@database:5432/osi
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy

  database:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      # Dev-only credentials — never reused in prod.
      - POSTGRES_USER=osi
      - POSTGRES_PASSWORD=osi
      - POSTGRES_DB=osi
    ports:
      # Host access for local tooling (drizzle-kit studio, psql) — localhost only.
      - "127.0.0.1:5432:5432"
    volumes:
      - osi-dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osi -d osi"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  osi-dev-db-data:
  osi-dev-uploads:
