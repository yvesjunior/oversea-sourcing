# Development stack — hot-reloading web app with source mounted from the host.
# Usage: ./scripts/dev.sh   (→ http://localhost:3010)

services:
  web:
    build:
      context: .
      dockerfile: infra/Docker/web.Dockerfile
      target: deps # dev runs the Vite dev server from the installed deps
    command: npm run dev
    working_dir: /app
    env_file:
      # Single .env holds config AND secrets (gitignored; see .env.example).
      - .env
    environment:
      - NODE_ENV=development
      # Dev-only credentials (non-secret by design; prod values live in .env)
      - DATABASE_URL=postgres://osi:osi@database:5432/osi
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-osi-dev-insecure-secret}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3010}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # First-class Redis (2026-08-22): distributed rate-limit counters, same
      # topology as prod. Fail-open by design (src/server/kv.ts), so web has no
      # hard dependency on it — a dead Redis degrades, never blocks login.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # Email-verification enforcement is prod-only (owner, 2026-08-28):
      # dev accounts are throwaways with no inbox. Default (unset) = enforced.
      - REQUIRE_EMAIL_VERIFICATION=${REQUIRE_EMAIL_VERIFICATION:-false}
    ports:
      # Same host port as prod (3010). Vite binds 8080 inside the container
      # (Lovable sandbox config) — only the host mapping changes.
      - "${WEB_PORT:-3010}:8080"
    volumes:
      - ./:/app
      - /app/node_modules # keep the image's node_modules, don't shadow with host
      - osi-dev-uploads:/data/uploads
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Background jobs (pg-boss): AI criteria extraction + pipeline orchestrator.
  worker:
    build:
      context: .
      dockerfile: infra/Docker/web.Dockerfile
      target: deps
    command: npx tsx watch src/worker.ts
    working_dir: /app
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://osi:osi@database:5432/osi
      # Full architecture (2026-08-22): this worker owns the pipeline queue
      # (orchestration, matching, sweep); worker-research owns collection.
      - WORKER_QUEUES=${WORKER_QUEUES:-pipeline}
    volumes:
      - ./:/app
      - /app/node_modules
      # The worker reads buyer attachments during research (E4) — same volume
      # `web` writes uploads to, or every file lookup is an ENOENT.
      - osi-dev-uploads:/data/uploads
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Dedicated research worker — the collection hotspot isolated on its own
  # queue (full architecture, 2026-08-22). Same image, WORKER_QUEUES=research;
  # scaling research = replicas of THIS service, pipeline stays untouched.
  worker-research:
    build:
      context: .
      dockerfile: infra/Docker/web.Dockerfile
      target: deps
    command: npx tsx watch src/worker.ts
    working_dir: /app
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://osi:osi@database:5432/osi
      - WORKER_QUEUES=research
    volumes:
      - ./:/app
      - /app/node_modules
      - osi-dev-uploads:/data/uploads
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # First-class cache (2026-08-22): shared rate-limit counters — dev runs the
  # same topology prod does. State stays in Postgres; Redis is disposable.
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - osi-dev-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # One-shot: applies Drizzle migrations on every `up`, then exits.
  migrate:
    build:
      context: .
      dockerfile: infra/Docker/web.Dockerfile
      target: deps
    command: npm run db:migrate
    working_dir: /app
    environment:
      - DATABASE_URL=postgres://osi:osi@database:5432/osi
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy

  database:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      # Dev-only credentials — never reused in prod.
      - POSTGRES_USER=osi
      - POSTGRES_PASSWORD=osi
      - POSTGRES_DB=osi
    ports:
      # Host access for local tooling (drizzle-kit studio, psql) — localhost only.
      - "127.0.0.1:5432:5432"
    volumes:
      - osi-dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osi -d osi"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  osi-dev-db-data:
  osi-dev-uploads:
  osi-dev-redis-data:
